      name="description"
      content="用可交互的三维剖切海盆，从海底断层错动讲到海啸上岸：深水快而低、浅水慢而高、波前可能先退、不止一道浪。"

  <body>
    <div id="app"></div>
    <noscript>
      <div style="max-width: 44rem; margin: 4rem auto; padding: 0 1.5rem; font-family: sans-serif; line-height: 1.7">
        <h1>海啸如何诞生</h1>
        <p>
          本页的三维演示需要 JavaScript。文字版要点：海啸通常由俯冲带逆断层的海底垂向错动推动整根水柱产生；
          深水时相速度 c=√(g·h) 可达约 700 km/h、波高常不足 1 米；进入浅水后减速、波长缩短、波高按 Green 定律上升；
          波列相位决定先到的是波谷还是波峰（因此并非一定先退）；危险往往持续数小时、不止一道浪。
        </p>
        <p>
          若沿岸感到强烈或持续很久的摇晃，或海水异常快速涨落，应立即向高处和内陆撤离，遵从当地官方预警，不要去海边观察。
        </p>
        <p>本页为示意教学模型，非等比、非实时预警、非淹没预测。</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
